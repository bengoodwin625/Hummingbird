# Render Blueprint: a web service (built from the Dockerfile) and a Postgres database.
# Both start on Render's free plans. Free web services sleep after a period without visitors
# and take a minute to wake; free databases expire after a limited time. Upgrade both plans
# in the Render dashboard before launching publicly.
services:
  - type: web
    name: hummingbird
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hummingbird-db
          property: connectionString

databases:
  - name: hummingbird-db
    plan: free
    databaseName: hummingbird
    user: hummingbird
